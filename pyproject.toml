[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openaffect-eeg"
version = "0.1.0"
description = "Leakage-resistant cross-context EEG affect benchmark"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PyYAML>=6.0.2",
  "requests>=2.32",
]

[project.optional-dependencies]
audit = [
  "numpy>=1.26,<3",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.12",
]
eeg = [
  "h5py>=3.11",
  "mne>=1.8",
  "mne-bids>=0.16",
  "numpy>=1.26,<3",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.12",
]
foundation = [
  "einops>=0.8",
  "timm>=0.9.16,<2",
  "torch>=2.6,<3",
  "torchaudio>=2.6,<3",
  "transformers==4.56.2",
]
standard_eegnet = [
  "braindecode==1.2.0",
]

paper = [
  "matplotlib>=3.9",
  "numpy>=1.26,<3",
  "pandas>=2.2",
]
smoke = [
  "numpy==2.4.6",
  "pandas==3.0.5",
  "pytest==9.1.1",
  "scikit-learn==1.9.0",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
openaffect = "openaffect_eeg.audit_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Cross-platform releases invoke these entry points with `python scripts/...`.
"scripts/*.py" = ["EXE001"]
