exclude:
  # Generated packaging metadata can cache local documentation and paths.
  - "src/**.egg-info/**"
  # Python bytecode is generated locally and is neither source nor reproducible.
  - "**/__pycache__/**"
  # Host-specific launchers contain private machine paths; portable Python CLIs are included.
  - "scripts/server_*.sh"
  # Figure QA reports and previews can contain workstation-local source paths.
  - "paper/neurips2026/figures/qa/**"
  - "paper/final_figures/qa/**"

forbidden_suffixes:
  - .set
  - .fdt
  - .edf
  - .bdf
  - .mat
  - .npy
  - .npz
  - .pt
  - .pth
  - .ckpt
  - .mp4
