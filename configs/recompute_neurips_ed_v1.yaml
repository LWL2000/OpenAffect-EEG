version: neurips_ed_v1
stages:
  - manifests
  - splits
  - transparent_features
  - foundation_features
  - evaluations
  - audits
  - statistics
  - compile

steps:
  - name: build_music_manifest
    stage: manifests
    environment: statistics
    after: []
    command:
      - ${project_root}/scripts/build_music_eeg_trials.py
      - ${data_root}/raw/openneuro/ds002721
      - ${data_root}/raw/stimuli/eerola_soundtracks_osf_p6vkg/mean_ratings_set1.csv
      - ${data_root}/derived/manifests
    requires:
      - ${data_root}/raw/openneuro/ds002721
      - ${data_root}/raw/stimuli/eerola_soundtracks_osf_p6vkg/mean_ratings_set1.csv
    produces:
      - ${data_root}/derived/manifests/ds002721_trials.tsv.gz

  - name: build_dens_manifest
    stage: manifests
    environment: statistics
    after: []
    command:
      - ${project_root}/scripts/build_dens_trials.py
      - ${data_root}/raw/openneuro/ds003751
      - ${data_root}/derived/manifests
    requires:
      - ${data_root}/raw/openneuro/ds003751
    produces:
      - ${data_root}/derived/manifests/ds003751_trials.tsv.gz

  - name: build_emo_manifest
    stage: manifests
    environment: statistics
    after: []
    command:
      - ${project_root}/scripts/build_emo_eeg_trials.py
      - ${data_root}/raw/openneuro/ds005540
      - ${data_root}/derived/manifests
    requires:
      - ${data_root}/raw/openneuro/ds005540
    produces:
      - ${data_root}/derived/manifests/ds005540_trials.tsv.gz

  - name: build_external_trials
    stage: manifests
    environment: statistics
    after: []
    command:
      - ${project_root}/scripts/build_emotion_regulation_trials.py
      - ${data_root}/raw/openneuro/ds006866
      - ${data_root}/derived/trial_tables
    requires:
      - ${data_root}/raw/openneuro/ds006866
    produces:
      - ${data_root}/derived/trial_tables/ds006866_trials.tsv.gz

  - name: build_external_foundation_manifest_v2
    stage: manifests
    environment: statistics
    after: [build_external_trials]
    command:
      - ${project_root}/scripts/build_emotion_regulation_foundation_manifest.py
      - ${data_root}/derived/trial_tables/ds006866_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds006866
      - ${data_root}/derived/manifests/ds006866_foundation_v2.tsv.gz
    requires:
      - ${data_root}/derived/trial_tables/ds006866_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds006866
    produces:
      - ${data_root}/derived/manifests/ds006866_foundation_v2.tsv.gz
      - ${data_root}/derived/manifests/ds006866_foundation_v2.json

  - name: build_core_splits
    stage: splits
    environment: statistics
    after: [build_music_manifest, build_dens_manifest, build_emo_manifest]
    command:
      - ${project_root}/scripts/build_strict_splits.py
      - ${data_root}/derived/manifests/ds002721_trials.tsv.gz
      - ${data_root}/derived/manifests/ds003751_trials.tsv.gz
      - ${data_root}/derived/manifests/ds005540_trials.tsv.gz
      - --output-dir
      - ${data_root}/derived/splits/core_v1
    requires:
      - ${data_root}/derived/manifests/ds002721_trials.tsv.gz
      - ${data_root}/derived/manifests/ds003751_trials.tsv.gz
      - ${data_root}/derived/manifests/ds005540_trials.tsv.gz
    produces:
      - ${data_root}/derived/splits/core_v1/core_trials.tsv.gz

  - name: build_context_splits
    stage: splits
    environment: statistics
    after: [build_emo_manifest]
    command:
      - ${project_root}/scripts/build_context_transfer_splits.py
      - ${data_root}/derived/manifests/ds005540_trials.tsv.gz
      - --output-dir
      - ${data_root}/derived/splits/emo_context_v1
    requires:
      - ${data_root}/derived/manifests/ds005540_trials.tsv.gz
    produces:
      - ${data_root}/derived/splits/emo_context_v1/video_to_imagery/seed-011.tsv.gz
      - ${data_root}/derived/splits/emo_context_v1/imagery_to_video/seed-011.tsv.gz

  - name: build_external_splits
    stage: splits
    environment: statistics
    after: [build_external_trials]
    command:
      - ${project_root}/scripts/build_emotion_regulation_splits.py
      - ${data_root}/derived/trial_tables/ds006866_trials.tsv.gz
      - ${data_root}/derived/splits/ds006866_subject_v1
    requires:
      - ${data_root}/derived/trial_tables/ds006866_trials.tsv.gz
    produces:
      - ${data_root}/derived/splits/ds006866_subject_v1/subject_holdout/seed-011.tsv.gz

  - name: build_external_subject_splits_v2
    stage: splits
    environment: statistics
    after: [build_external_trials]
    command:
      - ${project_root}/scripts/build_emotion_regulation_splits.py
      - ${data_root}/derived/trial_tables/ds006866_trials.tsv.gz
      - ${data_root}/derived/splits/ds006866_external_v2
    requires:
      - ${data_root}/derived/trial_tables/ds006866_trials.tsv.gz
    produces:
      - ${data_root}/derived/splits/ds006866_external_v2/subject_holdout/seed-011.tsv.gz
      - ${data_root}/derived/splits/ds006866_external_v2/subject_holdout/seed-101.tsv.gz

  - name: build_external_context_splits_v2
    stage: splits
    environment: statistics
    after: [build_external_subject_splits_v2]
    command:
      - ${project_root}/scripts/build_emotion_regulation_context_splits.py
      - ${data_root}/derived/trial_tables/ds006866_trials.tsv.gz
      - ${data_root}/derived/splits/ds006866_external_v2
    requires:
      - ${data_root}/derived/trial_tables/ds006866_trials.tsv.gz
      - ${data_root}/derived/splits/ds006866_external_v2/subject_holdout/seed-011.tsv.gz
    produces:
      - ${data_root}/derived/splits/ds006866_external_v2/context_split_summary.json
      - ${data_root}/derived/splits/ds006866_external_v2/context_only/nonsocial_to_social/seed-011.tsv.gz
      - ${data_root}/derived/splits/ds006866_external_v2/context_only/social_to_nonsocial/seed-101.tsv.gz
      - ${data_root}/derived/splits/ds006866_external_v2/subject_context_holdout/nonsocial_to_social/seed-011.tsv.gz
      - ${data_root}/derived/splits/ds006866_external_v2/subject_context_holdout/social_to_nonsocial/seed-101.tsv.gz

  - name: extract_music_bandpower
    stage: transparent_features
    environment: statistics
    after: [build_music_manifest]
    command:
      - ${project_root}/scripts/extract_bandpower_features.py
      - ${data_root}/derived/manifests/ds002721_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds002721
      - ${data_root}/derived/features/ds002721_bandpower.npz
    requires:
      - ${data_root}/derived/manifests/ds002721_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds002721
    produces:
      - ${data_root}/derived/features/ds002721_bandpower.npz

  - name: extract_dens_bandpower
    stage: transparent_features
    environment: statistics
    after: [build_dens_manifest]
    command:
      - ${project_root}/scripts/extract_bandpower_features.py
      - ${data_root}/derived/manifests/ds003751_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds003751
      - ${data_root}/derived/features/ds003751_bandpower.npz
      - --skip-unreadable
    requires:
      - ${data_root}/derived/manifests/ds003751_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds003751
    produces:
      - ${data_root}/derived/features/ds003751_bandpower.npz

  - name: audit_dens_feature_missingness
    stage: audits
    environment: statistics
    after: [build_core_splits, extract_dens_bandpower]
    command:
      - ${project_root}/scripts/analyze_feature_missingness.py
      - ${data_root}/derived/splits/core_v1/core_trials.tsv.gz
      - ${data_root}/derived/features/ds003751_bandpower.npz
      - ${data_root}/derived/results/ds003751_feature_missingness_v1.json
      - --dataset-id
      - ds003751
    requires:
      - ${data_root}/derived/splits/core_v1/core_trials.tsv.gz
      - ${data_root}/derived/features/ds003751_bandpower.npz
    produces:
      - ${data_root}/derived/results/ds003751_feature_missingness_v1.json

  - name: extract_emo_de
    stage: transparent_features
    environment: statistics
    after: [build_emo_manifest]
    command:
      - ${project_root}/scripts/extract_emo_de_features.py
      - ${data_root}/derived/manifests/ds005540_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds005540
      - ${data_root}/derived/features/ds005540_de.npz
    requires:
      - ${data_root}/derived/manifests/ds005540_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds005540
    produces:
      - ${data_root}/derived/features/ds005540_de.npz

  - name: build_support_matched_control
    stage: splits
    environment: statistics
    after: [build_core_splits, extract_emo_de]
    command:
      - ${project_root}/scripts/build_support_matched_control.py
      - ${data_root}/derived/splits/core_v1/core_trials.tsv.gz
      - ${data_root}/derived/splits/core_v1
      - ${data_root}/derived/features/ds005540_de.npz
      - ${data_root}/derived/splits/support_matched_control_v1
    requires:
      - ${data_root}/derived/splits/core_v1/core_trials.tsv.gz
      - ${data_root}/derived/features/ds005540_de.npz
    produces:
      - ${data_root}/derived/splits/support_matched_control_v1/support_matched_control_manifest.json
      - ${data_root}/derived/splits/support_matched_control_v1/support_matched_identity_overlap/seed-011.tsv.gz
      - ${data_root}/derived/splits/support_matched_control_v1/support_matched_identity_overlap/seed-011.audit.json
      - ${data_root}/derived/splits/support_matched_control_v1/support_matched_identity_overlap/seed-023.tsv.gz
      - ${data_root}/derived/splits/support_matched_control_v1/support_matched_identity_overlap/seed-023.audit.json
      - ${data_root}/derived/splits/support_matched_control_v1/support_matched_identity_overlap/seed-047.tsv.gz
      - ${data_root}/derived/splits/support_matched_control_v1/support_matched_identity_overlap/seed-047.audit.json
      - ${data_root}/derived/splits/support_matched_control_v1/support_matched_identity_overlap/seed-071.tsv.gz
      - ${data_root}/derived/splits/support_matched_control_v1/support_matched_identity_overlap/seed-071.audit.json
      - ${data_root}/derived/splits/support_matched_control_v1/support_matched_identity_overlap/seed-101.tsv.gz
      - ${data_root}/derived/splits/support_matched_control_v1/support_matched_identity_overlap/seed-101.audit.json

  - name: extract_external_bandpower
    stage: transparent_features
    environment: statistics
    after: [build_external_trials]
    command:
      - ${project_root}/scripts/extract_bandpower_features.py
      - ${data_root}/derived/trial_tables/ds006866_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds006866
      - ${data_root}/derived/features/ds006866_bandpower.npz
      - --skip-unreadable
    requires:
      - ${data_root}/derived/trial_tables/ds006866_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds006866
    produces:
      - ${data_root}/derived/features/ds006866_bandpower.npz

  - name: extract_external_labram_pretrained_v2
    stage: foundation_features
    environment: foundation
    after: [build_external_foundation_manifest_v2]
    command:
      - ${project_root}/scripts/extract_labram_bids_features.py
      - ${data_root}/derived/manifests/ds006866_foundation_v2.tsv.gz
      - ${data_root}/raw/openneuro/ds006866
      - ${labram_repository}
      - ${labram_checkpoint}
      - ${data_root}/derived/features/ds006866_labram_pretrained_v2.npz
      - --device
      - ${foundation_device}
      - --preprocessing-device
      - ${foundation_device}
      - --batch-size
      - "32"
      - --exclude-channels
      - HEO
      - VEO
      - EKG
      - GSR
      - Trigger
      - EMG
    requires:
      - ${data_root}/derived/manifests/ds006866_foundation_v2.tsv.gz
      - ${data_root}/raw/openneuro/ds006866
      - ${labram_repository}
      - ${labram_checkpoint}
    produces:
      - ${data_root}/derived/features/ds006866_labram_pretrained_v2.npz
      - ${data_root}/derived/features/ds006866_labram_pretrained_v2.json

  - name: extract_external_labram_random_v2
    stage: foundation_features
    environment: foundation
    after: [build_external_foundation_manifest_v2]
    command:
      - ${project_root}/scripts/extract_labram_bids_features.py
      - ${data_root}/derived/manifests/ds006866_foundation_v2.tsv.gz
      - ${data_root}/raw/openneuro/ds006866
      - ${labram_repository}
      - ${labram_checkpoint}
      - ${data_root}/derived/features/ds006866_labram_random_v2.npz
      - --device
      - ${foundation_device}
      - --preprocessing-device
      - ${foundation_device}
      - --batch-size
      - "32"
      - --exclude-channels
      - HEO
      - VEO
      - EKG
      - GSR
      - Trigger
      - EMG
      - --random-init
      - --random-init-seed
      - "20260821"
    requires:
      - ${data_root}/derived/manifests/ds006866_foundation_v2.tsv.gz
      - ${data_root}/raw/openneuro/ds006866
      - ${labram_repository}
    produces:
      - ${data_root}/derived/features/ds006866_labram_random_v2.npz
      - ${data_root}/derived/features/ds006866_labram_random_v2.json

  - name: extract_emo_raw_tensor
    stage: transparent_features
    environment: statistics
    after: [build_emo_manifest]
    command:
      - ${project_root}/scripts/extract_emo_raw_trials.py
      - ${data_root}/derived/manifests/ds005540_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds005540
      - ${data_root}/derived/tensors/ds005540_raw_100hz.npy
      - ${data_root}/derived/tensors/ds005540_raw_100hz_trial_uids.npy
      - --target-frequency
      - "100"
    requires:
      - ${data_root}/derived/manifests/ds005540_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds005540
    produces:
      - ${data_root}/derived/tensors/ds005540_raw_100hz.npy
      - ${data_root}/derived/tensors/ds005540_raw_100hz_trial_uids.npy

  - name: extract_cbramod_pretrained
    stage: foundation_features
    environment: foundation
    after: [build_emo_manifest]
    command:
      - ${project_root}/scripts/extract_cbramod_features.py
      - ${data_root}/derived/manifests/ds005540_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds005540
      - ${cbramod_repository}
      - ${cbramod_checkpoint}
      - ${data_root}/derived/features/ds005540_cbramod.npz
      - --device
      - ${foundation_device}
      - --batch-size
      - "32"
    requires:
      - ${data_root}/derived/manifests/ds005540_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds005540
      - ${cbramod_repository}
      - ${cbramod_checkpoint}
    produces:
      - ${data_root}/derived/features/ds005540_cbramod.npz

  - name: extract_cbramod_random
    stage: foundation_features
    environment: foundation
    after: [build_emo_manifest]
    command:
      - ${project_root}/scripts/extract_cbramod_features.py
      - ${data_root}/derived/manifests/ds005540_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds005540
      - ${cbramod_repository}
      - ${cbramod_checkpoint}
      - ${data_root}/derived/features/ds005540_cbramod_random.npz
      - --device
      - ${foundation_device}
      - --batch-size
      - "32"
      - --random-init
    requires:
      - ${data_root}/derived/manifests/ds005540_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds005540
      - ${cbramod_repository}
    produces:
      - ${data_root}/derived/features/ds005540_cbramod_random.npz

  - name: extract_labram_pretrained
    stage: foundation_features
    environment: foundation
    after: [build_emo_manifest]
    command:
      - ${project_root}/scripts/extract_labram_features.py
      - ${data_root}/derived/manifests/ds005540_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds005540
      - ${labram_repository}
      - ${labram_checkpoint}
      - ${data_root}/derived/features/ds005540_labram_pretrained_v1.npz
      - --device
      - ${foundation_device}
      - --batch-size
      - "32"
    requires:
      - ${data_root}/derived/manifests/ds005540_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds005540
      - ${labram_repository}
      - ${labram_checkpoint}
    produces:
      - ${data_root}/derived/features/ds005540_labram_pretrained_v1.npz

  - name: extract_labram_random
    stage: foundation_features
    environment: foundation
    after: [build_emo_manifest]
    command:
      - ${project_root}/scripts/extract_labram_features.py
      - ${data_root}/derived/manifests/ds005540_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds005540
      - ${labram_repository}
      - ${labram_checkpoint}
      - ${data_root}/derived/features/ds005540_labram_random_v1.npz
      - --device
      - ${foundation_device}
      - --batch-size
      - "32"
      - --random-init
    requires:
      - ${data_root}/derived/manifests/ds005540_trials.tsv.gz
      - ${data_root}/raw/openneuro/ds005540
      - ${labram_repository}
    produces:
      - ${data_root}/derived/features/ds005540_labram_random_v1.npz

  - &de_core
    name: evaluate_de_core
    stage: evaluations
    environment: statistics
    after: [build_core_splits, extract_emo_de]
    command:
      - ${project_root}/scripts/run_disentanglement_baseline.py
      - ${data_root}/derived/splits/core_v1/core_trials.tsv.gz
      - ${data_root}/derived/splits/core_v1
      - ${data_root}/derived/features/ds005540_de.npz
      - ${data_root}/derived/results/disentanglement_de_reference_core_v1.json
      - --feature-view
      - channel
      - --predictions-output
      - ${data_root}/derived/results/disentanglement_de_reference_core_v1_predictions.tsv.gz
    requires:
      - ${data_root}/derived/splits/core_v1/core_trials.tsv.gz
      - ${data_root}/derived/features/ds005540_de.npz
    produces:
      - ${data_root}/derived/results/disentanglement_de_reference_core_v1.json
      - ${data_root}/derived/results/disentanglement_de_reference_core_v1_predictions.tsv.gz

  - name: evaluate_de_context
    stage: evaluations
    environment: statistics
    after: [build_context_splits, extract_emo_de]
    command:
      - ${project_root}/scripts/run_disentanglement_baseline.py
      - ${data_root}/derived/splits/core_v1/core_trials.tsv.gz
      - ${data_root}/derived/splits/emo_context_v1
      - ${data_root}/derived/features/ds005540_de.npz
      - ${data_root}/derived/results/disentanglement_de_reference_context_v1.json
      - --feature-view
      - channel
      - --predictions-output
      - ${data_root}/derived/results/disentanglement_de_reference_context_v1_predictions.tsv.gz
    requires:
      - ${data_root}/derived/splits/core_v1/core_trials.tsv.gz
      - ${data_root}/derived/features/ds005540_de.npz
    produces:
      - ${data_root}/derived/results/disentanglement_de_reference_context_v1.json
      - ${data_root}/derived/results/disentanglement_de_reference_context_v1_predictions.tsv.gz

  - name: evaluate_de_support_matched_control
    stage: evaluations
    environment: statistics
    after: [build_support_matched_control]
    command:
      - ${project_root}/scripts/run_disentanglement_baseline.py
      - ${data_root}/derived/splits/core_v1/core_trials.tsv.gz
      - ${data_root}/derived/splits/support_matched_control_v1
      - ${data_root}/derived/features/ds005540_de.npz
      - ${data_root}/derived/results/disentanglement_de_support_matched_control_v1.json
      - --feature-view
      - channel
      - --predictions-output
      - ${data_root}/derived/results/disentanglement_de_support_matched_control_v1_predictions.tsv.gz
    requires:
      - ${data_root}/derived/splits/core_v1/core_trials.tsv.gz
      - ${data_root}/derived/features/ds005540_de.npz
      - ${data_root}/derived/splits/support_matched_control_v1/support_matched_control_manifest.json
    produces:
      - ${data_root}/derived/results/disentanglement_de_support_matched_control_v1.json
      - ${data_root}/derived/results/disentanglement_de_support_matched_control_v1_predictions.tsv.gz

  - name: evaluate_semantic_prior_ablation
    stage: audits
    environment: statistics
    after: [build_core_splits]
    command:
      - ${project_root}/scripts/run_semantic_prior_ablation.py
      - ${data_root}/derived/splits/core_v1/core_trials.tsv.gz
      - ${data_root}/derived/splits/core_v1
      - ${data_root}/derived/results/semantic_prior_ablation_v1.json
      - --predictions-output
      - ${data_root}/derived/results/semantic_prior_ablation_v1_predictions.tsv.gz
    requires:
      - ${data_root}/derived/splits/core_v1/core_trials.tsv.gz
    produces:
      - ${data_root}/derived/results/semantic_prior_ablation_v1.json
      - ${data_root}/derived/results/semantic_prior_ablation_v1_predictions.tsv.gz

  - name: evaluate_cbramod_core
    stage: evaluations
    environment: statistics
    after: [build_core_splits, extract_cbramod_pretrained]
    command:
      - ${project_root}/scripts/run_disentanglement_baseline.py
      - ${data_root}/derived/splits/core_v1/core_trials.tsv.gz
      - ${data_root}/derived/splits/core_v1
      - ${data_root}/derived/features/ds005540_cbramod.npz
      - ${data_root}/derived/results/disentanglement_cbramod_reference_core_v1.json
      - --feature-view
      - foundation
      - --predictions-output
      - ${data_root}/derived/results/disentanglement_cbramod_reference_core_v1_predictions.tsv.gz
    requires:
      - ${data_root}/derived/splits/core_v1/core_trials.tsv.gz
      - ${data_root}/derived/features/ds005540_cbramod.npz
    produces:
      - ${data_root}/derived/results/disentanglement_cbramod_reference_core_v1.json
      - ${data_root}/derived/results/disentanglement_cbramod_reference_core_v1_predictions.tsv.gz

  - name: evaluate_cbramod_context
    stage: evaluations
    environment: statistics
    after: [build_context_splits, extract_cbramod_pretrained]
    command:
      - ${project_root}/scripts/run_disentanglement_baseline.py
      - ${data_root}/derived/splits/core_v1/core_trials.tsv.gz
