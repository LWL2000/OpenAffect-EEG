    channel_order: [AF3, F7, F3, FC5, T7, P7, O1, O2, P8, T8, FC6, F4, F8, AF4]
    features:
      bandpower:
        path: derived/confirmatory_amigos_v14_inputs/amigos_bandpower.npz
