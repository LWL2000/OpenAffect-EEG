version: confirmatory_amigos_v14_experiment
design_seed: 20260914
resource_assignment_seed_rule: design_seed + global_split_index
fold_count: 100
doses: [0, 1, 2, 4, 8]
fold_rotation_seeds: [20260914, 20260931, 20260948, 20260965, 20260982]
training_seeds: [2026091401, 2026091402, 2026091403, 2026091404, 2026091405]
ridge_settings:
  ridge_locked: [0.1, 1.0, 10.0, 100.0]
eegnet_settings:
  eegnet_lr1e3: 0.001
  eegnet_lr1e4: 0.0001
eegnet:
  max_epochs: 100
  patience: 15
  batch_size: 128
  weight_decay: 0.0001
